<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="pageTitle">
    Resident Evil 4 - Home
  </title>

  <link rel="stylesheet" href="PICdiv1.css">

  <link rel="stylesheet" href="PICdiv2.css">

  <link rel="stylesheet" href="PICdiv3.css">

  <style>
    #OPVID {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;

      z-index: -1;

      position: fixed;

      object-fit: cover;
    }
  </style>
</head>


<body style="
        background-color: black;
        display: flex;
        align-items: center;
    ">

  <!-- 背景影片 -->
  <video autoplay muted loop id="OPVID">
    <source src="RE4/RE4OP.mp4" type="video/mp4">
  </video>


  <!-- 人物介紹 -->
  <div class="container1">

    <a href="npc.html">

      <img src="RE4/LEON.jpg" alt="Leon S. Kennedy" class="image1" style="width: 100%;">

    </a>

    <div class="middle1">

      <div class="text1" data-i18n="characterIntroduction">
        人<br>物<br>介<br>紹
      </div>

    </div>

  </div>


  <!-- 裝備介紹 -->
  <div class="container2">

    <a href="weapons.html">

      <img src="RE4/Ada.jpg" alt="Weapons" class="image2" style="width: 100%;">

    </a>

    <div class="middle2">

      <div class="text2" data-i18n="weaponIntroduction">
        裝<br>備<br>介<br>紹
      </div>

    </div>

  </div>


  <!-- 敵人介紹 -->
  <div class="container3">

    <a href="enemy.html">

      <img src="RE4/monster.png" alt="Enemies" class="image3" style="width: 100%;">

    </a>

    <div class="middle3">

      <div class="text3" data-i18n="enemyIntroduction">
        敵<br>人<br>介<br>紹
      </div>

    </div>

  </div>


  <!-- 共用 i18n -->
  <script src="../../javascript/i18n.js"></script>


  <!-- 本頁翻譯 -->
  <script>

    const translations = {

      zh: {

        pageTitle:
          "Resident Evil 4 - 首頁",

        characterIntroduction:
          "人<br>物<br>介<br>紹",

        weaponIntroduction:
          "裝<br>備<br>介<br>紹",

        enemyIntroduction:
          "敵<br>人<br>介<br>紹"
      },


      en: {

        pageTitle:
          "Resident Evil 4 - Home",

        characterIntroduction:
          "CHARACTERS",

        weaponIntroduction:
          "WEAPONS",

        enemyIntroduction:
          "ENEMIES"
      }

    };


    applyLanguage(
      translations
    );

  </script>

</body>

</html>
